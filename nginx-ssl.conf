# Configuration Nginx avec SSL/HTTPS
# Cette configuration sera générée automatiquement par Certbot
# Elle est fournie ici comme référence

# Redirection HTTP vers HTTPS
server {
    listen 80;
    server_name ylsix.com www.ylsix.com;
    return 301 https://$server_name$request_uri;
}

# Configuration HTTPS
server {
    listen 443 ssl http2;
    server_name ylsix.com www.ylsix.com;

    # Certificats SSL (générés par Certbot)
    ssl_certificate /etc/letsencrypt/live/ylsix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ylsix.com/privkey.pem;
    
    # Configuration SSL moderne
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Augmenter la taille maximale des uploads
    client_max_body_size 50M;

    # Logs
    access_log /var/log/nginx/recruteur20-access.log;
    error_log /var/log/nginx/recruteur20-error.log;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts pour les longues requêtes
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Gestion des fichiers statiques (optionnel, pour optimiser)
    location /_next/static {
        proxy_pass http://localhost:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, immutable";
    }
}

