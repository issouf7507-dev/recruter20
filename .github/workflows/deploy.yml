name: Deploy to VPS (Production)

on:
  push:
    branches:
      - dev-issouf
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Node + Corepack + pnpm
      - name: Setup Node.js + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.27.0 --activate
          pnpm -v   # Vérifie que pnpm est disponible

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4️⃣ Prisma
      - name: Generate Prisma Client
        run: pnpm prisma generate

      # 5️⃣ Build Next.js
      - name: Build application
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: pnpm build

      # 6️⃣ Déploiement SSH
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            export PATH="/usr/bin:/usr/local/bin:$PATH"
            APP_DIR="/home/dev-issouf/projects/recruteur20"
            mkdir -p $APP_DIR
            cd $APP_DIR

            # Git sync
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/${{ github.repository }}.git
            fi
            git fetch origin dev-issouf
            git reset --hard origin/dev-issouf
            git clean -fd

            # Install dependencies + Prisma (VPS)
            corepack enable
            pnpm install --frozen-lockfile
            pnpm prisma generate

            # Build (VPS)
            pnpm build

            # PM2
            pm2 stop recruter || true
            pm2 delete recruter || true
            pm2 start ecosystem.config.js
            pm2 save

            echo "✅ Déploiement terminé avec succès"

