name: Deploy to VPS (Production)

on:
  push:
    branches:
      - dev-issouf
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # 1️⃣ Récupération du code
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2️⃣ Setup Node + pnpm
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      # ----------------------------------------
      # 3️⃣ Install dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ----------------------------------------
      # 4️⃣ Prisma
      # ----------------------------------------
      - name: Generate Prisma Client
        run: pnpm prisma generate

      # ----------------------------------------
      # 5️⃣ Build Next.js
      # ----------------------------------------
      - name: Build application
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: pnpm build

      # ----------------------------------------
      # 6️⃣ Déploiement SSH
      # ----------------------------------------
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "🚀 Début du déploiement..."

            # 🔧 PATH pour SSH non-interactif
            export PATH="/usr/bin:/usr/local/bin:$PATH"

            # 📁 Dossier projet
            APP_DIR="/home/dev-issouf/projects/recruteur20"

            mkdir -p $APP_DIR
            cd $APP_DIR

            # ----------------------------------------
            # 🔄 Git sync
            # ----------------------------------------
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/${{ github.repository }}.git
            fi

            git fetch origin dev-issouf
            git reset --hard origin/dev-issouf
            git clean -fd

            # ----------------------------------------
            # 📦 Install deps (VPS)
            # ----------------------------------------
            corepack enable
            pnpm install --frozen-lockfile

            # ----------------------------------------
            # 🧬 Prisma
            # ----------------------------------------
            pnpm prisma generate

            # ----------------------------------------
            # 🏗 Build (VPS)
            # ----------------------------------------
            pnpm build

            # ----------------------------------------
            # 🧹 PM2 clean
            # ----------------------------------------
            pm2 stop recruter || true
            pm2 delete recruter || true

            # ----------------------------------------
            # 🚀 Start PM2
            # ----------------------------------------
            pm2 start ecosystem.config.js
            pm2 save

            echo "✅ Déploiement terminé avec succès"
