name: Deploy to VPS (Production)

on:
  push:
    branches:
      - dev-issouf
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkoutsssss
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      # 3️⃣ Setup Node.js with pnpm cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5️⃣ Prisma
      - name: Generate Prisma Client
        run: pnpm prisma generate

      # 6️⃣ Build Next.js
      - name: Build application
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: pnpm build

      # 7️⃣ Déploiement SSH
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: issouf
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          script: |
            set -e
            export PATH="/usr/bin:/usr/local/bin:$PATH"
            export CI=true
            APP_DIR="/home/issouf/apps/recruter20"
            mkdir -p $APP_DIR
            cd $APP_DIR

            # Git sync
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/${{ github.repository }}.git
            fi
            git fetch origin dev-issouf
            git reset --hard origin/dev-issouf
            git clean -fd

            # Install dependencies + Prisma (VPS)
            # Setup pnpm (try sudo first, fallback to npm install if needed)
            if ! command -v pnpm &> /dev/null; then
              echo "📦 Configuration de pnpm..."
              sudo corepack enable 2>/dev/null || {
                echo "⚠️  corepack enable nécessite sudo, tentative avec npm..."
                npm install -g pnpm@10.27.0 || {
                  echo "⚠️  Installation pnpm échouée, vérification si déjà installé..."
                }
              }
            fi
            pnpm --version || { echo "❌ pnpm n'est pas disponible"; exit 1; }

            # Clean node_modules to avoid permission issues
            echo "🧹 Nettoyage de node_modules..."
            rm -rf node_modules 2>/dev/null || sudo rm -rf node_modules 2>/dev/null || true

            pnpm install --frozen-lockfile
            pnpm prisma generate

            # Exécuter les migrations de base de données
            echo "🔄 Exécution des migrations Prisma..."
            pnpm prisma migrate deploy || echo "⚠️  Aucune migration à appliquer"

            # Build (VPS)
            echo "🏗️  Construction de l'application Next.js..."
            pnpm build

            # Compiler le serveur Socket.io
            echo "🔌 Compilation du serveur Socket.io..."
            mkdir -p dist/server
            npx tsc server/socket.ts --outDir dist/server --esModuleInterop --module commonjs --target es2020 --skipLibCheck --moduleResolution node || {
              echo "⚠️  Compilation Socket.io échouée, utilisation de tsx en production"
            }

            # Arrêter les processus PM2 existants
            echo "🔄 Redémarrage des processus PM2..."
            pm2 stop recruter-nextjs recruter-socket 2>/dev/null || true
            pm2 delete recruter-nextjs recruter-socket 2>/dev/null || true

            # Démarrer les processus PM2
            pm2 start ecosystem.config.js
            pm2 save

            echo "✅ Déploiement terminé avec succès"
